login:
  url: /login
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
  data:
    account: 13423232323
    password: "asdf123456"
  assert:
    status_code: 200
    status:
      jsonpath: $.status
      type: ==
      value: 200
    msg:
      jsonpath: $.msg
      type: in
      value: 登录成功
  extract:
    token: $.data.token

product_list:
  url: /home/products
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  params:
    ids:
    page: 1
    limit: 14
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
    product_id:
      jsonpath: $.data.list[0].id
      type: exists
  extract:
    product_id: $.data.list[0].id

product_detail:
  url: /product/detail/${{product_id}}
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
  extract:
    unique:
      type: conditional_find
      source: $.data.productValue
      conditions:
        - field: stock
          op: ">"
          value: 0
      pick_field: unique
      pick: first
      required: true
      error_message: 没有可用库存，无法下单

default_price:
  url: /product/detail/${{product_id}}/${{unique}}
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success

user_center:
  url: /user
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
  assert:
    status_code: 200

buy_now:
  url: /cart/add
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  data:
    productId: ${{product_id}}
    uniqueId: ${{unique}}
    new: 1
  assert:
    status_code: 200
  extract:
    cartId: $.data.cartId

check_shipping:
  url: /order/check_shipping
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  data:
    cartId: ${{cartId}}
    new: 1
  assert:
    status_code: 200

get_default_address:
  url: /address/default
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  assert:
    status_code: 200

order_confirm:
  url: /order/confirm
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  data:
    addressId: 0
    cartId: ${{cartId}}
    new: 1
    shipping_type: 1
  assert:
    status_code: 200
