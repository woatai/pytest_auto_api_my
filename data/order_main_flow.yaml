case_common:
  allureEpic: 下单主流程
  allureFeature: 完整流程
  allureStory: 用户正常下单

# 登录
login:
  host: ${{host()}}
  url: /login
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
  requestType: none
  is_run: true
  data:
    account: 13423232323
    password: "asdf123456"
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: 登录成功
  extract:
    token: $.data.token

# 查看商品列表
product_list: # case_id
  host: ${{host()}}
  url: /home/products
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  requestType: none
  is_run: true
  params:
    ids:
    page: 1
    limit: 14
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
    product_id:
      jsonpath: $.data.list[0].id
      type: exists
  extract:
    product_id: $.data.list[0].id

# 查看商品详情
product_detail:
  host: ${{host()}}
  url: /product/detail/${{product_id}}
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  requestType: none
  is_run: true
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
  extract:
    unique:
      type: conditional_find
      source: $.data.productValue
      conditions:
        - field: stock
          op: ">"
          value: 0
      pick_field: unique
      pick: first
      required: true # 是否必须要取到值
      error_message: 没有可用库存，无法下单

# 默认价格
default_price:
  host: ${{host()}}
  url: /product/detail/${{product_id}}/${{unique}}
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
  requestType: none
  is_run: true
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success

# 个人中心
user_center:
  host: ${{host()}}
  url: /user
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
  requestType: none
  is_run: true
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200

# 直接购买
buy_now:
  host: ${{host()}}
  url: /cart/add
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  requestType: none
  is_run: true
  data:
    productId: ${{product_id}}
    uniqueId: ${{unique}}
    new: 1
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
  extract:
    cartId: $.data.cartId
# 检查发货
check_shipping:
  host: ${{host()}}
  url: /order/check_shipping
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  requestType: none
  is_run: true
  data:
    cartId: ${{cartId}}
    new: 1
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
# 获取默认地址
get_default_address:
  host: ${{host()}}
  url: /address/default
  method: get
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  requestType: none
  is_run: true
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200
# 订单确认
order_confirm:
  host: ${{host()}}
  url: /order/confirm
  method: post
  headers:
    Content-Type: application/json;charset=UTF-8
    Authorization: Bearer ${{token}}
  requestType: none
  is_run: true
  data:
    addressId: 0
    cartId: ${{cartId}}
    new: 1
    shipping_type: 1
  dependence_case: false
  dependence_case_data: []
  assert:
    status_code: 200



assert:
  status_code: 200

  l1_status:
    jsonpath: $.status
    type: eq
    value: 200

  l1_msg:
    jsonpath: $.msg
    type: eq
    value: "success"

  l2_cart_num:
    jsonpath: $.data.cartInfo[0].cart_num
    type: eq
    value: 1

  l3_unique_match:
    jsonpath: $.data.cartInfo[0].product_attr_unique
    type: eq
    value: ${{unique}}

  l4_order_key_exists:
    jsonpath: $.data.orderKey
    type: exists

# 登录接口模板：

assert:
  status_code: 200
  l1_status:
    jsonpath: $.status
    type: eq
    value: 200
  l1_msg:
    jsonpath: $.msg
    type: eq
    value: "登录成功"
  l4_token:
    jsonpath: $.data.token
    type: exists


# 商品详情模板：
assert:
  status_code: 200
  l1_status:
    jsonpath: $.status
    type: eq
    value: 200
  l1_msg:
    jsonpath: $.msg
    type: eq
    value: "success"
  l2_store_name:
    jsonpath: $.data.storeInfo.store_name
    type: contains
    value: "iPad"
  l2_price:
    jsonpath: $.data.storeInfo.price
    type: eq
    value: "3999.00"
  l2_min_qty:
    jsonpath: $.data.storeInfo.min_qty
    type: eq
    value: 1
  l2_attr_1:
    jsonpath: $.data.productAttr[0].attr_name
    type: eq
    value: "颜色"

# 提取规格模板：
extract:
  unique:
    type: conditional_find
    source: $.data.productValue
    conditions:
      - field: stock
        op: ">"
        value: 0
    pick_field: unique
    pick: first
    required: true
    error_message: 没有可用库存


# 订单确认模板：
assert:
  status_code: 200

  l1_status:
    jsonpath: $.status
    type: eq
    value: 200
  l1_msg:
    jsonpath: $.msg
    type: eq
    value: "success"

  l2_valid_count:
    jsonpath: $.data.valid_count
    type: eq
    value: 1
  l2_cart_num:
    jsonpath: $.data.cartInfo[0].cart_num
    type: eq
    value: 1
  l2_attr_status:
    jsonpath: $.data.cartInfo[0].attrStatus
    type: eq
    value: true
  l2_is_valid:
    jsonpath: $.data.cartInfo[0].is_valid
    type: eq
    value: 1
  l2_sum_price:
    jsonpath: $.data.priceGroup.sumPrice
    type: eq
    value: "3999.00"
  l2_total_price:
    jsonpath: $.data.priceGroup.totalPrice
    type: eq
    value: "3999.00"

  l3_cart_id_match:
    jsonpath: $.data.cartInfo[0].id
    type: eq
    value: ${{cartId}}
  l3_unique_match:
    jsonpath: $.data.cartInfo[0].product_attr_unique
    type: eq
    value: ${{unique}}

  l4_order_key:
    jsonpath: $.data.orderKey
    type: exists
  l4_pay_weixin_open:
    jsonpath: $.data.pay_weixin_open
    type: eq
    value: true

# 空场景/异常场景模板：
assert:
  status_code: 200
  l1_status:
    jsonpath: $.status
    type: eq
    value: 200
  l1_msg:
    jsonpath: $.msg
    type: eq
    value: "empty"
  l2_data_empty:
    jsonpath: $.data
    type: eq
    value: []

# 未登录场景模板：
assert:
  status_code: 200
  l1_status:
    jsonpath: $.status
    type: eq
    value: 110002
  l1_msg:
    jsonpath: $.msg
    type: eq
    value: "请登录"
