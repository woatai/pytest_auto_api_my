product_list:
  name: 商品列表
  url: /home/products
  method: get
  params:
    ids:
    page: 1
    limit: 14
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
    product_id:
      jsonpath: $.data.list[0].id
      type: exists
  extract:
    product_id: $.data.list[0].id

product_detail:
  name: 商品详情
  url: /product/detail/${{product_id}}
  method: get
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
  extract:
    unique:
      type: conditional_find
      source: $.data.productValue
      conditions:
        - field: stock
          op: ">"
          value: 0
      pick_field: unique
      pick: first
      required: true
      error_message: 没有可用库存，无法下单

default_price:
  name: 默认价格
  url: /product/detail/${{product_id}}/${{unique}}
  method: get
  assert:
    status_code: 200
    msg:
      jsonpath: $.msg
      type: in
      value: success
